[package]
name = "hu20-trainer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native HU20 external-sampling CFR trainer with exact parity to src/blueprint/solver.py"
publish = false

[dependencies]
hu20-buckets = { path = "../hu20-buckets" }
blake2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.10"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
